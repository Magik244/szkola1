<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 30px;
            min-height: 100vh;

            background:
                url("tlo.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
            text-align: center;
            color: #222;
        }
        h1 {
            margin-bottom: 20px;
            color: white;
            font-size: 36px;

            text-shadow:
                3px 3px 0 #222,
                0 4px 10px black;
        }
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }
        .player {
            width: 150px;
            padding: 10px;
            background: rgb(243, 0, 0);
            border: 3px solid #000;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }
        .score {
            display: block;
            margin-top: 5px;
            font-size: 30px;
        }
        .game {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .card {
            width: 260px;
            height: 380px;
            padding: 12px;
            background: rgb(253, 253, 253);
            border: 3px solid #ff0000;
            border-radius: 15px;
        }
        .card img {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }
        .card h2 {
            margin: 5px 0;
            font-size: 24px;
            text-transform: capitalize;
        }
        .card p {
            margin: 4px 0;
            font-size: 14px;
        }
        .stats {
            margin-top: 5px;
            padding: 7px;
            background: #ff0303;
            border-radius: 8px;
        }
        .vs {
            font-size: 50px;
            font-weight: bold;
            color: rgb(253, 0, 0);
        }
        .tyl {
            background-image: url("pokemon_card.jpg");
            background-size: cover;
            background-position: center;
        }
        .winner {
            border-color: green;
        }
        .loser {
            opacity: 0.6;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }
        @keyframes blinkRed {
            0%, 100% {
                background: #333;
            }
            50% {
                background: #ff0000;
            }
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 18px;
            cursor: pointer;
            animation: blinkRed 1s infinite;
        }
        button:hover {
            background: #555;
        }
        #resetButton {
            background: #c0392b;
        }
        #resetButton:hover {
            background: red;
        }
        #result {
            min-height: 30px;
            margin-top: 25px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow:
                2px 2px 0 #222,
                0 3px 10px black;
        }
        .kajetan {
            position: fixed;
            left: 12px;
            bottom: 10px;
            padding: 6px 12px;
            background: linear-gradient(90deg, #ff0000, #fcfcfc, #ff0000);
            background-size: 200% auto;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            animation: moveGradient 3s linear infinite;
        }
        @keyframes moveGradient {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }
        @media (max-width: 700px) {
            body {
                padding: 20px;
            }
            .game {
                flex-direction: column;
                gap: 20px;
            }
            .card {
                width: 280px;
            }
            .scoreboard {
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <h1>Pokemon gierka</h1>
    <div class="scoreboard">

        <div class="player">
            Gracz 1
            <span id="score1" class="score">0</span>
        </div>

        <div class="player">
            Gracz 2
            <span id="score2" class="score">0</span>
        </div>

    </div>


    <div class="game">

        <div id="pokemon1" class="card tyl"></div>

        <div class="vs">VS</div>

        <div id="pokemon2" class="card tyl"></div>

    </div>


    <div class="buttons">

        <button id="fightButton">Walka</button>

        <button id="resetButton">Reset</button>

    </div>


    <div id="result"></div>

    <div class="kajetan">Kajetan</div>

    <script>
        var pokemonList = [];

        var score1 = 0;
        var score2 = 0;

        var pokemon1 = null;
        var pokemon2 = null;


        function loadPokemon() {

            fetch("https://pokeapi.co/api/v2/pokemon?limit=100")

                .then(function(response) {
                    return response.json();
                })

                .then(function(data) {

                    pokemonList = data.results;

                })

                .catch(function() {

                    document.getElementById("result").innerHTML =
                        "Nie udało się pobrać Pokemonów.";

                });
        }


        function getPokemon(name) {

            return fetch(
                "https://pokeapi.co/api/v2/pokemon/" + name
            )

            .then(function(response) {

                return response.json();

            });

        }


        function randomPokemon() {

            var number = Math.floor(
                Math.random() * pokemonList.length
            );

            return pokemonList[number].name;
        }


        function showPokemon(pokemon, card) {

            var image = pokemon.sprites.front_default;

            card.className = "card";

            card.innerHTML =

                "<h2>" + pokemon.name + "</h2>" +

                "<img src='" + image + "'>" +

                "<div class='stats'>" +

                "<p>Waga: " + pokemon.weight + "</p>" +

                "<p>Experience: " + pokemon.base_experience + "</p>" +

                "<p>HP: " + pokemon.stats[0].base_stat + "</p>" +

                "<p>Atak: " + pokemon.stats[1].base_stat + "</p>" +

                "<p>Obrona: " + pokemon.stats[2].base_stat + "</p>" +

                "<p>Szybkość: " + pokemon.stats[5].base_stat + "</p>" +

                "</div>";
        }


        function getPower(pokemon) {

            var power = 0;

            for (var i = 0; i < pokemon.stats.length; i++) {

                power = power + pokemon.stats[i].base_stat;

            }

            return power;
        }


        function updateScore() {

            document.getElementById("score1").innerHTML = score1;

            document.getElementById("score2").innerHTML = score2;

        }


        function fight() {

            if (pokemonList.length == 0) {

                document.getElementById("result").innerHTML =
                    "Poczekaj na załadowanie Pokemonów.";

                return;
            }


            document.getElementById("fightButton").disabled = true;


            var name1 = randomPokemon();
            var name2 = randomPokemon();


            while (name1 == name2) {

                name2 = randomPokemon();

            }


            document.getElementById("result").innerHTML =
                "Trwa walka...";


            Promise.all([
                getPokemon(name1),
                getPokemon(name2)
            ])

            .then(function(data) {

                pokemon1 = data[0];
                pokemon2 = data[1];


                showPokemon(
                    pokemon1,
                    document.getElementById("pokemon1")
                );


                showPokemon(
                    pokemon2,
                    document.getElementById("pokemon2")
                );


                var power1 = getPower(pokemon1);
                var power2 = getPower(pokemon2);


                if (power1 > power2) {

                    score1++;

                    document.getElementById("result").innerHTML =
                        pokemon1.name +
                        " wygrywa! Punkt dla Gracza 1.";

                    document.getElementById("pokemon1")
                        .classList.add("winner");

                    document.getElementById("pokemon2")
                        .classList.add("loser");

                }


                else if (power2 > power1) {

                    score2++;

                    document.getElementById("result").innerHTML =
                        pokemon2.name +
                        " wygrywa! Punkt dla Gracza 2.";

                    document.getElementById("pokemon2")
                        .classList.add("winner");

                    document.getElementById("pokemon1")
                        .classList.add("loser");

                }


                else {

                    document.getElementById("result").innerHTML =
                        "REMIS! Nikt nie dostaje punktu.";

                }


                updateScore();


                if (score1 == 5) {

                    document.getElementById("result").innerHTML =
                        "Gracz 1 zdobył 5 punktów! Koniec gry!";

                }


                if (score2 == 5) {

                    document.getElementById("result").innerHTML =
                        "Gracz 2 zdobył 5 punktów! Koniec gry!";

                }


                if (score1 < 5 && score2 < 5) {

                    document.getElementById("fightButton").disabled = false;

                }

            })

            .catch(function() {

                document.getElementById("result").innerHTML =
                    "Wystąpił błąd.";

                document.getElementById("fightButton").disabled = false;

            });

        }


        function resetGame() {

            score1 = 0;
            score2 = 0;

            updateScore();


            document.getElementById("pokemon1").className =
                "card tyl";

            document.getElementById("pokemon2").className =
                "card tyl";


            document.getElementById("pokemon1").innerHTML = "";

            document.getElementById("pokemon2").innerHTML = "";


            document.getElementById("result").innerHTML = "";

            document.getElementById("fightButton").disabled = false;

        }


        document.getElementById("fightButton")
            .addEventListener("click", fight);


        document.getElementById("resetButton")
            .addEventListener("click", resetGame);


        loadPokemon();
    </script>
</body>
</html>
